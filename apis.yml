aid: mokkerai
name: Mokker.ai
description: >-
  Mokker AI is an AI product-photography tool that replaces the background of a
  product photo with a realistic, AI-generated scene and upscales images,
  turning a plain product shot into studio-quality marketing imagery without
  Photoshop. It serves e-commerce sellers and marketers across categories like
  cosmetics, electronics, furniture, and jewellery. Mokker is now part of soona
  (soona.co/mokker) and exposes a v2 REST API in early access that offers the
  same background-replacement and upscale capabilities as its web app, with free
  API credits for developers building integrations. Mokker is backed by Point
  Nine and was added to the API Evangelist network as a portfolio lead.
